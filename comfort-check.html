<div class="container">

<h1>Comfort Check</h1>

<p class="lede">
A calm little tool to help figure out what might be going on.
</p>

<div class="question">

<h2>What feels closest to the issue?</h2>

<button class="option" onclick="showResult('friction')">
Friction or chafing
</button>

<button class="option" onclick="showResult('dryness')">
Dryness during activity
</button>

<button class="option" onclick="showResult('irritation')">
Skin feels irritated or raw
</button>

<button class="option" onclick="showResult('aftercare')">
Just want a better aftercare routine
</button>

<button class="option" onclick="showResult('unsure')">
Not sure — something just feels off
</button>

</div>

<div id="result" class="result"></div>

</div>
</div>
</main>

<footer>
<div class="container">
© <span id="y"></span> WAP MOP SHOPPE ·
<a href="/disclosure.html">Disclosure</a>
</div>
</footer>

<script>

function showResult(type){

let box = document.getElementById("result");

let responses = {

friction: `
<h2>This sounds like friction.</h2>
<p>
Friction problems usually come from heat + moisture + repetition.
Reducing friction early prevents most irritation.
</p>
<p>
Read: <a href="/articles/how-to-prevent-chafing.html">How to Prevent Chafing</a>
</p>
`,

dryness: `
<h2>This sounds like dryness.</h2>
<p>
Dry friction is one of the most common causes of discomfort.
More lubrication and slower pacing usually solve it quickly.
</p>
<p>
Related: <a href="/articles/how-to-prevent-chafing.html">Friction & Chafing Guide</a>
</p>
`,

irritation: `
<h2>This sounds like barrier irritation.</h2>
<p>
When skin gets warm and irritated, the best move is usually to
reduce activity, keep things breathable, and let the barrier calm down.
</p>
<p>
Related: <a href="/articles/laundry-as-intimate-care.html">Laundry as Intimate Care</a>
</p>
`,

aftercare: `
<h2>You’re thinking about aftercare.</h2>
<p>
Aftercare is simple: reduce moisture, reduce friction, restore calm.
Small rituals matter more than complex routines.
</p>
<p>
Explore: <a href="/shoppe/aftercare.html">Aftercare Picks</a>
</p>
`,

unsure: `
<h2>Start simple.</h2>
<p>
Most comfort issues come from friction, moisture, or irritation.
Reducing those variables solves the majority of problems.
</p>
<p>
Start here: <a href="/articles/how-to-prevent-chafing.html">Chafing Guide</a>
</p>
`

};

box.innerHTML = responses[type];
box.style.display = "block";

}

document.getElementById('y').textContent = new Date().getFullYear();

</script>
